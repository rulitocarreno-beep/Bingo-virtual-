<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo Casa de Luz</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#fff3d9;
    text-align:center;
    margin:0;
    padding:20px;
}
h1{
    color:#7a1fa2;
}
#ultima{
    font-size:32px;
    font-weight:bold;
    color:red;
    margin:20px;
}
.carton{
    display:grid;
    grid-template-columns:repeat(5,70px);
    gap:8px;
    justify-content:center;
}
.casilla{
    background:white;
    border:2px solid #7a1fa2;
    border-radius:8px;
    padding:15px;
    font-size:22px;
    font-weight:bold;
}
</style>
</head>
<body>

<h1>🎱 Bingo Casa de Luz</h1>

<div id="ultima">Última bolilla: --</div>

<div class="carton" id="carton"></div>

<script>
let carton=document.getElementById("carton");

for(let i=1;i<=25;i++){
    let c=document.createElement("div");
    c.className="casilla";
    c.innerHTML=i;
    carton.appendChild(c);
}
</script>

</body>
</html>
