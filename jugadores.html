
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartón Bingo - Casa de Luz</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  text-align:center;
  background:#fff3d9;
  color:#222;
}

h1{
  font-size:32px;
  margin-bottom:5px;
}

h2{
  font-size:24px;
  margin-top:5px;
}

.carton{
  max-width:430px;
  margin:25px auto;
  background:white;
  padding:15px;
  border-radius:18px;
  box-shadow:0 5px 20px #0003;
}

.titulo{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  margin-bottom:5px;
}

.titulo div{
  background:#7b1fa2;
  color:white;
  font-size:28px;
  font-weight:bold;
  padding:10px 0;
  border-radius:8px;
}

.numeros{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
}

.numero{
  height:62px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid #7b1fa2;
  border-radius:10px;
  font-size:24px;
  font-weight:bold;
  cursor:pointer;
}

.numero.marcado{
  background:#7b1fa2;
  color:white;
}

.libre{
  background:#ffd54f;
  font-size:16px;
}

button{
  margin-top:20px;
  padding:15px 25px;
  font-size:18px;
  font-weight:bold;
  border:0;
  border-radius:12px;
  background:#7b1fa2;
  color:white;
}
</style>
</head>

<body>

<h1>🎱 BINGO VIRTUAL</h1>
<h2>✨ Casa de Luz ✨</h2>

<p>Tu cartón</p>

<div class="carton">

  <div class="titulo">
    <div>B</div>
    <div>I</div>
    <div>N</div>
    <div>G</div>
    <div>O</div>
  </div>

  <div class="numeros" id="carton"></div>

</div>

<p>👉 Tocá cada número para marcarlo.</p>

<button onclick="nuevoCarton()">🎟️ NUEVO CARTÓN</button>
