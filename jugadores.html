<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bingo Casa de Luz - Jugadores</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff3d9;
  color:#222;
  text-align:center;
  min-height:100vh;
  padding:25px 12px;
}

h1{
  font-size:38px;
  margin:20px 0 5px;
}

h2{
  font-size:30px;
  margin:10px 0 35px;
}

.subtitulo{
  font-size:25px;
  margin-bottom:20px;
}

.carton{
  background:white;
  max-width:620px;
  margin:auto;
  padding:20px;
  border-radius:25px;
  box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.encabezado,
.fila{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.encabezado div{
  background:#8524ad;
  color:white;
  font-size:32px;
  font-weight:bold;
  padding:15px 5px;
  border-radius:12px;
}
