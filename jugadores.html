<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bingo Casa de Luz - Jugadores</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff3d9;
  color:#3b2b20;
  text-align:center;
  min-height:100vh;
  padding:25px 15px;
}

h1{
  font-size:38px;
  margin:20px 0 5px;
}

h2{
  font-size:28px;
  margin:10px 0 30px;
}

.tarjeta{
  background:white;
  max-width:420px;
  margin:auto;
  padding:25px;
  border-radius:20px;
  box-shadow:0 5px 18px rgba(0,0,0,.15);
}

.numero{
  font-size:100px;
  font-weight:bold;
  margin:20px 0;
}

.estado{
  font-size:20px;
  font-weight:bold;
  margin-bottom:20px;
}

.historial{
  margin-top:25px;
  font-size:18px;
  line-height:1.6;
}
</style>
</head>

<body>

<h1>🎱 BINGO VIRTUAL</h1>
<h2>✨ Casa de Luz ✨</h2>

<div class="tarjeta">

  <h3>Número sorteado</h3>

  <div id="numero" class="numero">--</div>

  <div id="estado" class="estado">
    Esperando el próximo número...
  </div>

  <div class="historial">
    <strong>Números sorteados:</strong>
    <div id="historial">Todavía no hay números.</div>
  </div>

</div>

<script>

function actualizar(){
  const numero = localStorage.getItem("bingoNumero");
  const historial = localStorage.getItem("bingoHistorial");

  if(numero){
    document.getElementById("numero").textContent = numero;
    document.getElementById("estado").textContent =
      "🎉 Número sorteado";
  }

  if(historial){
    document.getElementById("historial").textContent = historial;
  }
}

actualizar();

setInterval(actualizar,1000);

</script>

</body>
</html>
