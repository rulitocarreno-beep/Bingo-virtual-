<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa de Luz - Cartones</title>

<style>
body{
    margin:0;
    background:#fff3d9;
    font-family:Arial,sans-serif;
    text-align:center;
}
h1{
    color:#7a1fa2;
    margin:20px;
}
.lista{
    max-width:500px;
    margin:auto;
}
.carton{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:white;
    margin:10px;
    padding:15px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
}
a{
    background:#7a1fa2;
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border-radius:8px;
    font-weight:bold;
}
</style>

</head>
<body>

<h1>🎱 Bingo Casa de Luz</h1>

<div class="lista" id="lista"></div>

<script>
let lista = document.getElementById("lista");

for (let i = 1; i <= 30; i++) {

    let fila = document.createElement("div");
    fila.className = "carton";

    let numero = String(i).padStart(3, "0");

    fila.innerHTML =
        "<span>🎟️ Cartón " + numero + "</span>" +
        "<a href='jugadores.html?carton=" + i + "'>Abrir</a>";

    lista.appendChild(fila);
}
</script>

</body>
</html>
